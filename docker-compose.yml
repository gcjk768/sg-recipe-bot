services:
  recipebot:
    networks: [default, scrape-net]   # shared Playwright server ws://playwright:3000/
    build: .
    # Dockge Update/Start then rebuilds from the code on disk instead of reusing the old image.
    pull_policy: build
    container_name: recipebot
    env_file: .env
    environment:
      PLAYWRIGHT_WS_URL: ws://playwright:3000/
      # TZ from .env wins; Asia/Singapore is only the fallback.
      TZ: ${TZ:-Asia/Singapore}
      RECIPEBOT_DATA_DIR: /data
      # Obsidian vault (movement log + memory). On the NAS set VAULT_HOST_PATH in .env.
      VAULT_DIR: /vault
      # Family recipe website: every posted recipe is added to data/site/daily.json.
      SITE_EXPORT_DIR: /data/site
      # the owner, 2026-10-08: no Telegram messages (recipes or alerts); the website is the only output.
      TELEGRAM_ENABLED: "false"
    volumes:
      - ./data:/data
      - "${VAULT_HOST_PATH:-./data/vault}:/vault"
    # init forwards SIGTERM so "docker stop" ends the sleep loop cleanly instead of waiting to be killed.
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # One shot instead of the daemon (for the NAS task scheduler or a manual test):
    #   docker compose run --rm recipebot recipebot run --dry-run
    #   docker compose run --rm recipebot recipebot run

  # Family recipe website (site/index.html), read-only static files.
  # Open http://<NAS LAN IP>:8780 at home or http://<NAS Tailscale IP>:8780 over Tailscale.
  # Rebuild the data with "python site/build.py" on a PC, then copy site/ here; no restart needed.
  recipe-site:
    image: nginx:1.27-alpine
    container_name: recipe-site
    ports:
      - "8780:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./data/site:/usr/share/nginx/html/daily:ro
      - ./site-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Optional: Claude Code CLI in a container, with this folder mounted, for editing and operating
  # the bot from the NAS. Not started by "docker compose up"; run it on demand:
  #   docker compose build claude
  #   docker compose run --rm claude                  interactive session in this folder
  #   docker compose run --rm claude remote-control   makes it show up in the Claude app
  # Login (first run) is kept in the claude-home volume, so you only sign in once.
  claude:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.claude
    container_name: recipebot-claude
    working_dir: /workspace
    volumes:
      - .:/workspace
      - claude-home:/home/node
    environment:
      TZ: ${TZ:-Asia/Singapore}
    stdin_open: true
    tty: true

volumes:
  claude-home:

networks:
  scrape-net:
    external: true
