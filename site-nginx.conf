# Family recipe website (recipe-site container). "no-cache" makes browsers check for a newer
# page every visit (a cheap ETag check), so a deploy or the bot's daily update shows up at once
# instead of after nginx's default heuristic caching.
server {
    listen 80;
    root /usr/share/nginx/html;
    location / {
        index index.html;
        add_header Cache-Control "no-cache";
    }
}
